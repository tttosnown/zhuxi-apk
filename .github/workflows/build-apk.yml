name: Build Zhuxi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/
          cp code-bank.json app/src/main/assets/
          cp code-bank.min.json app/src/main/assets/
          cp norm-library.json app/src/main/assets/
          cp manifest.webmanifest app/src/main/assets/
          cp sw.js app/src/main/assets/

          cp icon-192.png app/src/main/assets/icon-192.png

      - name: Build
        run: echo "Android project will be generated here"
